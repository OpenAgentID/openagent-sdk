[package]
name = "openagent-auth-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
description = "OAAP — OpenAgent Auth Protocol. Transport-agnostic 4-step mutual authentication handshake for autonomous agents using OAS DIDs, Ed25519, X25519 ECDH, and BLAKE3."
repository = "https://github.com/OpenAgentID/openagent-sdk"
keywords = ["auth", "protocol", "handshake", "openagent", "did"]
categories = ["authentication", "cryptography"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# Crypto
blake3 = "1.5"
rand = "0.8"

# Serialization + encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Async
async-trait = "0.1"

# Errors + logging
thiserror = "2.0"
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }

[dev-dependencies]
tokio = { version = "1.36", features = ["full", "test-util"] }
