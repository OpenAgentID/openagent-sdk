[package]
name = "openagent-auth-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
description = "Transport-agnostic type layer for the OpenAgent Core Protocol identity flow (challenge-response authentication, Core Protocol Specification Section 15)."
repository = "https://github.com/OpenAgentID/openagent-sdk"
keywords = ["auth", "protocol", "handshake", "openagent", "did"]
categories = ["authentication", "cryptography"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
# Crypto
rand = "0.10"
hex = "0.4"

# Serialization + encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JCS (RFC 8785) canonicalization - the challenge signing payload is the
# JCS bytes of the challenge object, per Core Protocol Specification S5.
serde_jcs = "0.1"
base64 = "0.22"

# Async
async-trait = "0.1"

# Errors + logging
thiserror = "2.0"
tracing = "0.1"

# Time
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }

[dev-dependencies]
tokio = { version = "1.36", features = ["full", "test-util"] }
