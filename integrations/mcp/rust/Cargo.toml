[package]
name = "openagent-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
description = "OpenAgent middleware for the Model Context Protocol — adds OAS identity, Arsenal capability tokens, and AEGIS authorization to any rmcp server in three lines."
homepage = "https://openagent.id/docs/integrations/mcp"
repository = "https://github.com/OpenAgentID/openagent-sdk"
keywords = ["mcp", "openagent", "oas", "did", "agents"]
categories = ["authentication", "asynchronous", "api-bindings"]

[features]
# By default the crate compiles standalone with just the trait surface
# and a small in-memory test runtime. Enable `rmcp` to pull in the
# adapter that wires the middleware into a real `rmcp::ServerHandler`.
default = []

# Adapter for the upstream `rmcp` crate (Rust MCP SDK). Pinned below.
# Kept behind a feature flag because rmcp's public API has changed
# multiple times in the 0.x line; downstream applications should pick
# the version that matches their server.
rmcp = ["dep:rmcp"]

[dependencies]
# Async + serialization — load-bearing on the public API.
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.36", default-features = false, features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1.7", features = ["v4"] }

# Pulled in only when the `rmcp` feature is enabled. The adapter is
# API-agnostic (it converts via serde_json rather than importing rmcp
# types), so this tracks a maintained release that resolves the rmcp
# Streamable-HTTP DNS-rebinding advisory (GHSA-89vp-x53w-74fx, fixed in
# 1.4.0); downstream applications can override to match their server.
rmcp = { version = "1.4", optional = true, default-features = false, features = ["server"] }

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
serde_json = "1.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
