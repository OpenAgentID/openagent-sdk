[package]
name = "openagent-ws"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
description = "WebSocket adapter for the OpenAgent Auth Protocol (OAAP) — maps the 4-step OAAP handshake onto WebSocket connections for real-time agent-to-agent communication."
repository = "https://github.com/OpenAgentID/openagent-sdk"
keywords = ["websocket", "auth", "agent", "openagent", "oaap"]
categories = ["authentication", "web-programming::websocket"]

[dependencies]
# Crypto primitives — single source of truth.
openagent-crypto-wasm = { path = "../../../crates/openagent-crypto-wasm", default-features = true }

# Async runtime + WebSocket transport.
tokio = { version = "1.36", features = ["sync", "rt", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# Serialization.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling + observability.
thiserror = "2.0"
tracing = "0.1"

# Hex encoding for session IDs and keys in JSON frames.
hex = { version = "0.4", default-features = false, features = ["std"] }

# Constant-time comparison (re-exported from crypto-wasm but also useful standalone).
zeroize = { version = "1.7", features = ["zeroize_derive"] }

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
