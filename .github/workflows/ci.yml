name: conformance OAS lock refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh-lock:
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: conformance/runner-rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Authenticate pinned private OAS dependency
        env:
          CI_PAT: ${{ secrets.OPENAGENTID_CI_PAT }}
        run: |
          test -n "$CI_PAT"
          git config --global url."https://x-access-token:${CI_PAT}@github.com/OpenAgentID/oas".insteadOf "https://github.com/OpenAgentID/oas"
      - name: Regenerate actual locked OAS dependency graph
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
        run: |
          cargo update --package oas-sdk --package oas-resolve --package oas-lineage
          cargo metadata --locked --no-deps --format-version 1 > lock-metadata.json
          sha256sum Cargo.toml Cargo.lock > lock-receipt.sha256
      - name: Remove private git credentials
        if: always()
        run: rm -f ~/.gitconfig
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-oas-lock
          if-no-files-found: error
          path: |
            conformance/runner-rust/Cargo.toml
            conformance/runner-rust/Cargo.lock
            conformance/runner-rust/lock-metadata.json
            conformance/runner-rust/lock-receipt.sha256
