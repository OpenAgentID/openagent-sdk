name: ci

# Verification for every change to the OpenAgent SDK: the Rust crates, the
# TypeScript SDK, and the language-neutral conformance vectors run against
# both runners.
#
# The Rust side consumes OAS, Arsenal, and AEGIS through private git
# dependencies; the authenticate-git step is what lets CI resolve them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  public-onboarding:
    name: public developer quickstart (Node ${{ matrix.node }})
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Build public SDK with no private repository credentials
        working-directory: sdks/typescript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build and test project generator
        working-directory: packages/create-openagent
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
      - name: Install browser test dependencies
        working-directory: tools/public-onboarding
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Verify packed public packages, real HTTP and live browser
        env:
          OAID_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/public-onboarding/verify.mjs
      - name: Verify live One heads in real Chromium
        env:
          OAID_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OAID_ONE_ARTIFACT_DIR: .public-tooling-artifacts/one
        run: node tools/public-onboarding/verify-one.mjs
      - name: Preserve release archives and verification receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-onboarding-node-${{ matrix.node }}
          path: .public-tooling-artifacts/
          include-hidden-files: true
          if-no-files-found: error

  rust:
    name: rust fmt, clippy, test
    runs-on: depot-ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        crate:
          # Not a Cargo workspace - each crate is a standalone package and is
          # verified as one, so a break in one cannot mask another.
          # adapters/weave is deliberately absent: it is the informative
          # Phase-2 Weave binding, mid-migration, and does not compile.
          - sdks/rust
          - crates/openagent-crypto-wasm
          - crates/openagent-auth-protocol
          - adapters/http/rust
          - conformance/runner-rust
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Fetch locked dependencies
        # sdks/rust and conformance/runner-rust fetch OAS, Arsenal and AEGIS from
        # private OpenAgentID repositories with the org-level secret
        # OPENAGENTID_CI_PAT (contents:read on oas, arsenal, aegis). The token
        # exists only in this step's environment, never in a config file that
        # later steps or actions could read. Other crates use registry packages.
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          PRIVATE_SIBLINGS: ${{ (matrix.crate == 'sdks/rust' || matrix.crate == 'conformance/runner-rust') && 'oas arsenal aegis' || '' }}
          CI_PAT: ${{ (matrix.crate == 'sdks/rust' || matrix.crate == 'conformance/runner-rust') && secrets.OPENAGENTID_CI_PAT || '' }}
        run: |
          if [ -n "$PRIVATE_SIBLINGS" ]; then
            if [ -z "$CI_PAT" ]; then
              echo "::error::secrets.OPENAGENTID_CI_PAT is not set; the default GITHUB_TOKEN cannot read the private OAS, Arsenal and AEGIS repositories."
              exit 1
            fi
            index=0
            for repository in $PRIVATE_SIBLINGS; do
              export "GIT_CONFIG_KEY_${index}=url.https://x-access-token:${CI_PAT}@github.com/OpenAgentID/${repository}.insteadOf"
              export "GIT_CONFIG_VALUE_${index}=https://github.com/OpenAgentID/${repository}"
              index=$((index + 1))
            done
            export GIT_CONFIG_COUNT=$index
          fi
          unset CI_PAT
          cargo fetch --locked

      - name: Clippy (default features)
        run: cargo clippy --all-targets

      - name: Clippy (all features)
        # sdks/rust has real feature gates (arsenal, aegis): the minimal
        # configuration and the full one are different programs, and both
        # must stay green.
        run: cargo clippy --all-targets --all-features

      - name: Test (all features)
        # Facade integration tests require both optional subsystems; default
        # features would skip them silently.
        run: cargo test --all-features

  typescript:
    name: typescript typecheck, test, build (${{ matrix.package }})
    runs-on: depot-ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Every npm package the release workflow publishes
        # (tools/release/release-set.json) except create-openagent, which the
        # public-onboarding job builds and tests, plus the EAS anchor adapter.
        package:
          - sdks/typescript
          - sdks/testing
          - adapters/http/typescript
          - integrations/mcp/typescript
          - integrations/claude-agent-sdk/typescript
          - bridges/scim/typescript
          - bridges/oidc/typescript
          - adapters/eas/typescript
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Use npm 11.21.0
        # The npm the release workflow and the compatibility runner use.
        working-directory: .
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check browser bundle budgets
        # The live One runtime (@openagentid/sdk/browser/one) stays within
        # 16 KiB gzipped, the One app's script budget, and the all-family
        # bundle within 65 KiB gzipped (scripts/check-size.mjs).
        if: matrix.package == 'sdks/typescript'
        run: npm run size

      - name: Verify public character service over HTTP
        if: matrix.package == 'sdks/typescript'
        working-directory: .
        run: node --test services/character-api/test.mjs

      - name: Test against the SDK built from this commit
        # The companions declare @openagentid/sdk as a peer and develop
        # against the published release; this runs them against the SDK they
        # will be released with, as the release workflow does.
        if: matrix.package != 'sdks/typescript' && matrix.package != 'adapters/eas/typescript'
        run: |
          sdk="$GITHUB_WORKSPACE/sdks/typescript"
          npm ci --prefix "$sdk" --ignore-scripts --no-audit --no-fund --loglevel=error
          npm run build --prefix "$sdk"
          tarball=$(cd "$sdk" && npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP" | jq -r '.[0].filename')
          npm install --no-save --ignore-scripts --no-audit --no-fund --loglevel=error "$RUNNER_TEMP/$tarball"
          echo "testing against @openagentid/sdk $(jq -r .version node_modules/@openagentid/sdk/package.json) from $tarball"
          npm run typecheck
          npm test

  release-checks:
    name: release metadata, changelogs, audit and commit messages
    runs-on: depot-ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Root manifest matches the SDK manifest
        run: node tools/release/sync-root-manifest.mjs --check

      - name: Changelogs are ordered and dated by npm
        run: node tools/release/check-changelogs.mjs --registry

      - name: Changelog check against a mocked registry, including the release commit
        run: node --test tools/release/check-changelogs.test.mjs

      - name: Every LICENSE-APACHE is the verbatim Apache License 2.0
        # sha256 of https://www.apache.org/licenses/LICENSE-2.0.txt
        run: |
          expected=cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30
          status=0
          for file in $(git ls-files '*LICENSE-APACHE'); do
            actual=$(sha256sum "$file" | cut -d' ' -f1)
            if [ "$actual" != "$expected" ]; then echo "::error file=$file::not the verbatim Apache License 2.0 text"; status=1; fi
          done
          exit $status

      - name: Released packages have no high or critical runtime advisories
        run: |
          for directory in $(jq -r '.packages[].directory' tools/release/release-set.json); do
            echo "== $directory"
            (cd "$directory" && npm audit --omit=dev --audit-level=high --package-lock-only)
          done

      - name: Conventional commits, no CI skipping, no attribution trailers
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node tools/release/check-commits.mjs "$BASE_SHA" "$HEAD_SHA"

  wasm:
    name: crypto-wasm build and smoke test
    runs-on: depot-ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.13.1'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Build the WASM package
        # Builds both targets (bundler + nodejs) and patches the package to
        # the scoped @openagentid/crypto-wasm name.
        working-directory: crates/openagent-crypto-wasm
        run: node scripts/build-wasm.mjs

      - name: Mint the ACT smoke fixture
        # Regenerates the canonical test envelope deterministically (fixed
        # seed, pinned claims), so the smoke test also proves minting.
        working-directory: crates/openagent-crypto-wasm
        run: cargo run --example mint_act --quiet > scripts/act_fixture.hex

      - name: Smoke test the built package
        # Proves the publishable artifact loads and runs its core primitives
        # in Node before anything downstream may depend on it.
        working-directory: crates/openagent-crypto-wasm
        run: node scripts/smoke-test.mjs

  kotlin:
    name: kotlin sdk build and test (with vectors)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/kotlin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test (includes the 13 canonical ACT vectors)
        # VectorTest executes the same conformance vectors that gate the
        # other five languages.
        run: ./gradlew build --no-daemon

  swift:
    name: swift sdk build and test (with vectors)
    runs-on: depot-macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: sdks/swift
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: '6.2'

      - name: Build
        run: swift build

      - name: Test (includes the 13 canonical ACT vectors)
        # The VectorTests target executes the same conformance vectors that
        # gate Rust, TypeScript, Python, and Go.
        run: swift test

  go:
    name: go sdk vet, test, and vectors
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: README quickstart compiles
        # The docs-truth gate.
        run: go build ./examples/quickstart

      - name: ACT conformance vectors
        # The same 13 canonical vectors that gate Rust, TypeScript, and
        # Python.
        run: go run ./cmd/run-vectors ../../conformance/vectors/arsenal/act-verify.json

  python:
    name: python sdk test and vectors
    runs-on: depot-ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: README quickstart compiles
        # The docs-truth gate: if the README sample stops compiling, the
        # README has drifted from the package.
        run: python -m py_compile examples/quickstart.py

      - name: ACT conformance vectors
        # The same 13 canonical vectors that gate Rust and TypeScript. The
        # Python SDK proves its spec-exact implementation agrees with the
        # canonical crate before anything ships.
        run: python scripts/run_vectors.py

  conformance:
    name: conformance vectors (rust + ts)
    runs-on: depot-ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.13.1'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: conformance/runner-rust

      - name: Fetch locked conformance dependencies
        # The Rust runner uses private OAS and public ACT at pinned revisions.
        # The token exists only in this step's environment.
        working-directory: conformance/runner-rust
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CI_PAT: ${{ secrets.OPENAGENTID_CI_PAT }}
        run: |
          if [ -z "$CI_PAT" ]; then
            echo "::error::secrets.OPENAGENTID_CI_PAT is not set."
            exit 1
          fi
          export GIT_CONFIG_COUNT=1
          export "GIT_CONFIG_KEY_0=url.https://x-access-token:${CI_PAT}@github.com/OpenAgentID/oas.insteadOf"
          export "GIT_CONFIG_VALUE_0=https://github.com/OpenAgentID/oas"
          unset CI_PAT
          cargo fetch --locked

      - name: Build the crypto-wasm package
        # The TS runner's act-verify vectors run through this binding; it
        # must exist before the suite executes.
        working-directory: crates/openagent-crypto-wasm
        run: node scripts/build-wasm.mjs

      - name: Run all vectors
        # The conformance suite is the drift control for the whole stack:
        # both runners must agree with the same vectors, or the languages
        # have diverged and nothing else may merge.
        run: conformance/scripts/run-all.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-reports
          path: conformance/.reports/
          if-no-files-found: ignore
          include-hidden-files: true


  codeowners:
    name: codeowners resolve
    runs-on: depot-ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Every owner handle resolves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          errors=$(gh api "repos/${{ github.repository }}/codeowners/errors" \
            --jq '.errors // []')
          count=$(printf '%s' "$errors" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "::error::CODEOWNERS has ${count} unresolvable entr(y/ies)"
            printf '%s' "$errors" | jq -r '.[] | "  line \(.line): \(.message) - \(.source)"'
            exit 1
          fi
          echo "ok: every CODEOWNERS handle resolves"
