name: ci

# Verification for every change to the OpenAgent SDK: the Rust crates, the
# TypeScript SDK, and the language-neutral conformance vectors run against
# both runners.
#
# The Rust side consumes OAS, Arsenal, and AEGIS through private git
# dependencies; the authenticate-git step is what lets CI resolve them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: rust fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        crate:
          # Not a Cargo workspace - each crate is a standalone package and is
          # verified as one, so a break in one cannot mask another.
          # adapters/weave is deliberately absent: it is the informative
          # Phase-2 Weave binding, mid-migration, and does not compile.
          - sdks/rust
          - crates/openagent-crypto-wasm
          - crates/openagent-auth-protocol
          - adapters/http/rust
          - conformance/runner-rust
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for private sibling dependencies
        # Requires the org-level secret OPENAGENTID_CI_PAT with contents:read
        # on the OpenAgentID sibling repositories (oas, arsenal, aegis, act).
        env:
          CI_PAT: ${{ secrets.OPENAGENTID_CI_PAT }}
        run: |
          if [ -z "$CI_PAT" ]; then
            echo "::error::secrets.OPENAGENTID_CI_PAT is not set."
            echo "Cargo fetches OAS, Arsenal, and AEGIS from private OpenAgentID repositories;"
            echo "the default GITHUB_TOKEN cannot read them."
            exit 1
          fi
          git config --global url."https://x-access-token:${CI_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets

      - name: Clippy (all features)
        # sdks/rust has real feature gates (arsenal, aegis): the minimal
        # configuration and the full one are different programs, and both
        # must stay green.
        run: cargo clippy --all-targets --all-features

      - name: Test (all features)
        # Facade integration tests require both optional subsystems; default
        # features would skip them silently.
        run: cargo test --all-features

      - name: Remove git credentials
        if: always()
        run: rm -f ~/.gitconfig

  typescript:
    name: typescript sdk typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        # sdks/typescript deliberately carries no lockfile (the root package
        # builds it with --no-package-lock), so `npm ci` cannot run here. The
        # lockfile policy for published packages is decided in the release
        # phase; until then this is an install, not a frozen restore.
        run: npm install --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Build and typecheck sdk-testing
        # The in-memory backends the SDK's own tests import. Built here so a
        # break in the sibling package surfaces in the same run.
        working-directory: sdks/testing
        run: |
          npm install --no-audit --no-fund --loglevel=error
          npx tsc --noEmit
          npx tsup

  wasm:
    name: crypto-wasm build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for private sibling dependencies
        # The crate depends on agent-capability-token from the private
        # OpenAgentID/act repository.
        env:
          CI_PAT: ${{ secrets.OPENAGENTID_CI_PAT }}
        run: |
          if [ -z "$CI_PAT" ]; then
            echo "::error::secrets.OPENAGENTID_CI_PAT is not set."
            exit 1
          fi
          git config --global url."https://x-access-token:${CI_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the WASM package
        # Builds both targets (bundler + nodejs) and patches the package to
        # the scoped @openagent/crypto-wasm name.
        working-directory: crates/openagent-crypto-wasm
        run: node scripts/build-wasm.mjs

      - name: Mint the ACT smoke fixture
        # Regenerates the canonical test envelope deterministically (fixed
        # seed, pinned claims), so the smoke test also proves minting.
        working-directory: crates/openagent-crypto-wasm
        run: cargo run --example mint_act --quiet > scripts/act_fixture.hex

      - name: Smoke test the built package
        # Proves the publishable artifact loads and runs its core primitives
        # in Node before anything downstream may depend on it.
        working-directory: crates/openagent-crypto-wasm
        run: node scripts/smoke-test.mjs

      - name: Remove git credentials
        if: always()
        run: rm -f ~/.gitconfig

  go:
    name: go sdk vet, test, and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: ACT conformance vectors
        # The same 13 canonical vectors that gate Rust, TypeScript, and
        # Python.
        run: go run ./cmd/run-vectors ../../conformance/vectors/arsenal/act-verify.json

  python:
    name: python sdk test and vectors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: ACT conformance vectors
        # The same 13 canonical vectors that gate Rust and TypeScript. The
        # Python SDK proves its spec-exact implementation agrees with the
        # canonical crate before anything ships.
        run: python scripts/run_vectors.py

  conformance:
    name: conformance vectors (rust + ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate git for private sibling dependencies
        # The Rust conformance runner links the same wrapped crates as the SDK.
        env:
          CI_PAT: ${{ secrets.OPENAGENTID_CI_PAT }}
        run: |
          if [ -z "$CI_PAT" ]; then
            echo "::error::secrets.OPENAGENTID_CI_PAT is not set."
            exit 1
          fi
          git config --global url."https://x-access-token:${CI_PAT}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: conformance/runner-rust

      - name: Build the crypto-wasm package
        # The TS runner's act-verify vectors run through this binding; it
        # must exist before the suite executes.
        working-directory: crates/openagent-crypto-wasm
        run: node scripts/build-wasm.mjs

      - name: Run all vectors
        # The conformance suite is the drift control for the whole stack:
        # both runners must agree with the same vectors, or the languages
        # have diverged and nothing else may merge.
        run: conformance/scripts/run-all.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: conformance/.reports/
          if-no-files-found: ignore

      - name: Remove git credentials
        if: always()
        run: rm -f ~/.gitconfig

  codeowners:
    name: codeowners resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Every owner handle resolves
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          errors=$(gh api "repos/${{ github.repository }}/codeowners/errors" \
            --jq '.errors // []')
          count=$(printf '%s' "$errors" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "::error::CODEOWNERS has ${count} unresolvable entr(y/ies)"
            printf '%s' "$errors" | jq -r '.[] | "  line \(.line): \(.message) - \(.source)"'
            exit 1
          fi
          echo "ok: every CODEOWNERS handle resolves"
