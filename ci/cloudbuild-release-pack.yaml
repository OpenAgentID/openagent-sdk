# The npm release on Google Cloud Build (AGENTS.md rule 5; docs/RELEASING.md), build 1 of 2: the PACK build. Checks,
# plans, builds, tests and packs the release, runs npm publish --dry-run, and stages the packed tarballs, SHA256SUMS and
# plan.json at gs://l1fe-minds-fc-oaid-release/openagent-sdk/<tag>/<sha>/. No secret, and it runs as the default build
# service account, which cannot read the npm token (MUST-84-S1: this build runs repository and dependency code).
#   bash tools/release/cloudbuild-release.sh vX.Y.Z <40-hex sha>
# Its last step prints the exact publish command with the sha256 of SHA256SUMS and of plan.json (_SUMS, _PLAN).
# Reads the tag from the public repository: no source is uploaded and no GitHub token enters the build.
steps:
- id: checkout
  name: us-central1-docker.pkg.dev/l1fe-minds-fc/fleets-serving/ci-hooks-gate@sha256:76e82e003457e38a619eeef6daa18744c7a53190750128dd257e675a4bb38a62
  entrypoint: bash
  # The tag from the repository itself (never an uploaded tree), and only if it names the commit the owner pinned.
  args:
  - -c
  - |
    set -euo pipefail
    git clone --quiet https://github.com/OpenAgentID/openagent-sdk.git src
    cd src
    git fetch --quiet origin "refs/tags/$_TAG:refs/tags/$_TAG"
    git checkout --quiet --detach "refs/tags/$_TAG^{commit}"
    test "$(git rev-parse HEAD)" = "$_SHA" || { echo "$_TAG is not the pinned $_SHA"; exit 1; }
- id: checks
  name: us-central1-docker.pkg.dev/l1fe-minds-fc/fleets-serving/ci-hooks-gate@sha256:76e82e003457e38a619eeef6daa18744c7a53190750128dd257e675a4bb38a62
  entrypoint: bash
  args: ['/workspace/src/tools/release/cloudbuild-step.sh', 'checks']
  env: ['TAG=$_TAG', 'SHA=$_SHA', 'CI=true']
- id: plan
  name: us-central1-docker.pkg.dev/l1fe-minds-fc/fleets-serving/ci-hooks-gate@sha256:76e82e003457e38a619eeef6daa18744c7a53190750128dd257e675a4bb38a62
  entrypoint: bash
  args: ['/workspace/src/tools/release/cloudbuild-step.sh', 'plan']
  env: ['TAG=$_TAG', 'SHA=$_SHA', 'CI=true']
- id: metadata
  name: us-central1-docker.pkg.dev/l1fe-minds-fc/fleets-serving/ci-hooks-gate@sha256:76e82e003457e38a619eeef6daa18744c7a53190750128dd257e675a4bb38a62
  entrypoint: bash
  args: ['/workspace/src/tools/release/cloudbuild-step.sh', 'metadata']
  env: ['TAG=$_TAG', 'SHA=$_SHA', 'CI=true']
- id: dry-run
  name: us-central1-docker.pkg.dev/l1fe-minds-fc/fleets-serving/ci-hooks-gate@sha256:76e82e003457e38a619eeef6daa18744c7a53190750128dd257e675a4bb38a62
  entrypoint: bash
  args: ['/workspace/src/tools/release/cloudbuild-step.sh', 'dry-run']
  env: ['TAG=$_TAG', 'SHA=$_SHA', 'CI=true']
- id: stage
  name: us-central1-docker.pkg.dev/l1fe-minds-fc/fleets-serving/ci-hooks-gate@sha256:76e82e003457e38a619eeef6daa18744c7a53190750128dd257e675a4bb38a62
  entrypoint: bash
  # What the publish build will accept, pinned by the release owner from this log.
  args:
  - -c
  - |
    set -euo pipefail
    cp /workspace/plan.json /workspace/release-files/plan.json
    cd /workspace/release-files
    sha256sum -c SHA256SUMS
    sums="$$(sha256sum SHA256SUMS | cut -d' ' -f1)"
    plan="$$(sha256sum plan.json | cut -d' ' -f1)"
    echo "Pack build $_TAG ($_SHA) staged. Publish exactly these bytes with:"
    echo "  bash tools/release/cloudbuild-release.sh $_TAG $_SHA --publish $$sums $$plan"
    cat SHA256SUMS
artifacts:
  objects:
    location: gs://l1fe-minds-fc-oaid-release/openagent-sdk/$_TAG/$_SHA/
    paths: ['/workspace/release-files/*']
substitutions:
  _TAG: ''
  _SHA: ''
options:
  logging: CLOUD_LOGGING_ONLY
  pool:
    name: projects/l1fe-minds-fc/locations/us-central1/workerPools/oneos-std-usc1
timeout: 3600s
