[package]
name = "conformance-runner"
version = "0.1.0"
edition = "2021"
description = "OpenAgent SDK conformance test runner (Rust) — loads JSON vectors and diffs against the reference Rust crypto stack"
license = "Apache-2.0 OR MIT"
publish = false
default-run = "conformance-runner"

[[bin]]
name = "conformance-runner"
path = "src/main.rs"

[[bin]]
name = "generate-vectors"
path = "../scripts/generate-vectors.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
# The canonical ACT implementation - runners verify through this, never a
# handwritten re-implementation (the drift rule).
# The canonical Section 15 identity-flow types and checks - identity-proof
# vectors validate through this crate, never a handwritten copy.
openagent-auth-protocol = { path = "../../crates/openagent-auth-protocol" }
agent-capability-token = { git = "https://github.com/OpenAgentID/act", branch = "main", version = "0.1.0" }

# The anchor authority dispatcher and its trait - the anchor-resolve vectors
# evaluate through the same AnchoredAuthoritySource production uses.
# Pin the canonical OAS anchor-authority API without an external sibling checkout.
oas-sdk = { git = "https://github.com/OpenAgentID/oas", rev = "b923582981e756c8f4aef0668947934b8de125cb", version = "1.1.1" }
oas-resolve = { git = "https://github.com/OpenAgentID/oas", rev = "b923582981e756c8f4aef0668947934b8de125cb", version = "1.1.1" }
oas-lineage = { git = "https://github.com/OpenAgentID/oas", rev = "b923582981e756c8f4aef0668947934b8de125cb", version = "1.1.1" }
async-trait = "0.1"
tokio = { version = "1.36", features = ["rt-multi-thread"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
blake3 = "1.5"
aes-gcm = "0.10"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
thiserror = "1.0"
rand = "0.8"
jsonschema = { version = "0.17", default-features = false }
