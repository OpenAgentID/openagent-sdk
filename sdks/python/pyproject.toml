[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagentid-sdk"
version = "0.1.0"
description = "OpenAgent SDK — identity, authentication, and Agent Capability Token verification for autonomous agents."
readme = "README.md"
license = { text = "Apache-2.0 OR MIT" }
requires-python = ">=3.10"
authors = [{ name = "OpenAgentID" }]
keywords = ["agent", "identity", "did", "oas", "openagent", "act", "capability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cbor2>=5.4",
    "cryptography>=42",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "starlette>=0.37"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://openagent.id"
Repository = "https://github.com/OpenAgentID/openagent-sdk"
Specification = "https://github.com/OpenAgentID/act"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
