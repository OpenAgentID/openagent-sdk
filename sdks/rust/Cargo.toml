[package]
name = "openagent-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
description = "OpenAgent SDK — Clerk for autonomous agents. One import for OAS identity, Arsenal credentials, and AEGIS verification."
homepage = "https://openagent.id"
repository = "https://github.com/OpenAgentID/openagent-sdk"
documentation = "https://docs.rs/openagent-sdk"
readme = "README.md"
keywords = ["agent", "identity", "did", "oas", "openagent"]
categories = ["authentication", "cryptography", "api-bindings"]

[features]
default = []
# Enable AEGIS verification + delegation features (pulls in the heavier verification pipeline).
aegis = ["dep:openagent-aegis-sdk", "dep:openagent-aegis-core"]
# Enable Arsenal credential proxy + capability features (pulls in the broker client).
arsenal = ["dep:arsenal-sdk", "dep:arsenal-core"]
# Convenience: turn everything on.
full = ["aegis", "arsenal"]

[dependencies]
# Wrapped SDKs.
oas-sdk = { git = "https://github.com/OpenAgentID/oas", branch = "main", version = "1.1.0", default-features = false }
oas-crypto = { git = "https://github.com/OpenAgentID/oas", branch = "main", version = "1.1.0" }
oas-document = { git = "https://github.com/OpenAgentID/oas", branch = "main", version = "1.1.0" }
oas-lineage = { git = "https://github.com/OpenAgentID/oas", branch = "main", version = "1.1.0" }
# Optional subsystems. The features used to be no-ops and always linked these;
# they are real now: a build without them neither compiles the modules nor
# links the crates, so a verifier-only consumer pays for nothing it does not
# use. Calls into a disabled subsystem fail closed with a config error.
arsenal-sdk = { git = "https://github.com/OpenAgentID/arsenal", branch = "main", version = "2.0.0", optional = true }
arsenal-core = { git = "https://github.com/OpenAgentID/arsenal", branch = "main", version = "2.0.0", optional = true }
openagent-aegis-sdk = { git = "https://github.com/OpenAgentID/aegis", branch = "main", version = "0.2.0", optional = true }
openagent-aegis-core = { git = "https://github.com/OpenAgentID/aegis", branch = "main", version = "0.2.0", optional = true }

# Async + util.
tokio = { version = "1.36", features = ["sync", "rt", "macros"] }
async-trait = "0.1"

# Serde / time / errors / observability.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2.0"
tracing = "0.1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
# Tests construct agent identities, which since Arsenal 2.0 require an OAS DID.
oas-did = { git = "https://github.com/OpenAgentID/oas", branch = "main", version = "1.1.0" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
