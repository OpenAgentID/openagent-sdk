[package]
name = "openagent-scim"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
description = "SCIM 2.0 provisioning bridge trait definitions for OpenAgent — enterprise agent lifecycle via RFC 7644"
repository = "https://github.com/OpenAgentID/openagent-sdk"
keywords = ["scim", "provisioning", "openagent", "did", "identity"]
categories = ["authentication", "web-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
