AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: OpenAgent ACT receiver with explicit broker trust.
Parameters:
  Issuer:
    Type: String
  Audience:
    Type: String
  Tenant:
    Type: String
  PublicKeys:
    Type: String
    Description: JSON array of base64url Ed25519 broker public keys.
  RequiredScope:
    Type: String
  RevokedTokenIds:
    Type: String
    Default: '[]'
  RevokedSubjects:
    Type: String
    Default: '[]'
Resources:
  Receiver:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      Handler: dist/handler.handler
      CodeUri: .
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          OPENAGENT_ISSUER: !Ref Issuer
          OPENAGENT_AUDIENCE: !Ref Audience
          OPENAGENT_TENANT: !Ref Tenant
          OPENAGENT_PUBLIC_KEYS: !Ref PublicKeys
          OPENAGENT_REQUIRED_SCOPE: !Ref RequiredScope
          OPENAGENT_REVOKED_TOKEN_IDS: !Ref RevokedTokenIds
          OPENAGENT_REVOKED_SUBJECTS: !Ref RevokedSubjects
      Events:
        Agent:
          Type: Api
          Properties:
            Path: /api/agent
            Method: any
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get
