# OpenAgent Auth Server — Docker Compose
# Usage: docker compose up

services:
  openagent-auth:
    build: .
    ports:
      - '3100:3100'
    environment:
      PORT: '3100'
      OPENAGENT_PARENT_DID: 'did:oas:l1fe:hmr:your-human-root'
      OPENAGENT_AGENT_NAME: 'docker-agent'
      # OAS_RESOLVER_URL: 'https://resolver.openagent.id'
      # ARSENAL_BROKER_URL: 'https://broker.arsenal.id'
      # AEGIS_VERIFIER_URL: 'https://verify.aegis.id'
      # OIDC_ISSUER_URL: 'https://your-idp.example.com'
      # OIDC_CLIENT_ID: 'your-client-id'
      # OIDC_CLIENT_SECRET: 'your-client-secret'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3100/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

