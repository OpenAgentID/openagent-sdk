name = "openagent-receiver"
main = "worker.ts"
compatibility_date = "2026-07-01"
[build]
command = "node prepare-wasm.mjs"
[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = true

# Configure the explicit public receiver policy via wrangler secret put:
# OPENAGENT_ISSUER, OPENAGENT_AUDIENCE, OPENAGENT_TENANT,
# OPENAGENT_PUBLIC_KEYS, OPENAGENT_REQUIRED_SCOPE,
# OPENAGENT_REVOKED_TOKEN_IDS, OPENAGENT_REVOKED_SUBJECTS.
# No default trust, fake DID, provisioned KV, or fallback authentication.
